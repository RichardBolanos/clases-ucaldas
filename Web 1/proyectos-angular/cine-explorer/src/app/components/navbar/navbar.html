<!-- navbar.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" routerLink="/">🎬 CineExplorer</a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/favorites" routerLinkActive="active">
            Favoritos
            @if (cantidad$ | async; as cantidad) {
              @if (cantidad > 0) {
                <span class="badge bg-danger ms-1">{{ cantidad }}</span>
              }
            }
          </a>
        </li>
      </ul>

      <!-- Buscador -->
      <form class="d-flex me-2" (ngSubmit)="buscar()">
        <input class="form-control me-2" type="search"
               placeholder="Buscar películas..."
               [(ngModel)]="terminoBusqueda"
               name="busqueda"
               aria-label="Buscar películas">
        <button class="btn btn-outline-light" type="submit">🔍</button>
      </form>

      <!-- Toggle tema -->
      <button class="btn btn-outline-light btn-sm" (click)="toggleTema()"
              [attr.aria-label]="temaActual === 'light' ? 'Cambiar a tema oscuro' : 'Cambiar a tema claro'">
        {{ temaActual === 'light' ? '🌙' : '☀️' }}
      </button>
    </div>
  </div>
</nav>
