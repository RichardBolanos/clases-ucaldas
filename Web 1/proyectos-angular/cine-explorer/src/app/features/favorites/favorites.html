<!-- favorites.html -->
<div class="container py-4">
  <h2 class="mb-4">❤️ Mis Favoritas</h2>

  @if (favoritas$ | async; as favoritas) {
    @if (favoritas.length === 0) {
      <div class="text-center py-5">
        <p class="text-muted fs-5">No tenés películas favoritas todavía</p>
        <p class="text-muted">Explorá películas y hacé click en 🤍 para agregarlas</p>
      </div>
    } @else {
      <div class="row g-4">
        @for (movie of favoritas; track movie.id) {
          <div class="col-sm-6 col-md-4 col-lg-3 col-xl-2">
            <app-movie-card
              [movie]="movie"
              [esFavorita]="esFavorita(movie.id)"
              (toggleFavorito)="toggleFavorito($event)" />
          </div>
        }
      </div>
    }
  }
</div>
